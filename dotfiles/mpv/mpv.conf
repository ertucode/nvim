cache=yes
demuxer-max-bytes=300MiB
cache-secs=300
autofit=2500x1200

# When a local file is opened, add sibling files of the same media category.
autocreate-playlist=same

# ModernX replaces mpv's stock OSC with a cleaner, configurable bottom bar.
osc=no

# Resume previously opened files from their last playback position.
save-position-on-quit=yes
# Keep generated playback state out of the version-controlled config directory.
watch-later-dir=~/.local/state/mpv/watch_later

# Prefer English subtitles, then Turkish, even when the audio matches.
slang=eng,tur
subs-with-matching-audio=yes

# Discover external subtitles whose names contain the media filename.
sub-auto=fuzzy

# Allow development-time config reloads without restarting mpv.
input-ipc-server=~~/mpv.sock
