# Use the up/down arrow keys for volume instead of seeking.
UP add volume 2
DOWN add volume -2

# Do not interpret horizontal trackpad or mouse-wheel scrolling as seeking.
WHEEL_LEFT ignore
WHEEL_RIGHT ignore

# Tap to toggle pause; hold briefly for temporary accelerated playback.
SPACE script-binding space_hold/hold-speed-2x
Ctrl+SPACE script-binding space_hold/hold-speed-3x
Alt+SPACE script-binding space_hold/hold-speed-4x

# Seek with distance and destination feedback.
LEFT script-binding seek_feedback/backward
RIGHT script-binding seek_feedback/forward
Shift+LEFT script-binding seek_feedback/previous-subtitle
Shift+RIGHT script-binding seek_feedback/next-subtitle

# Navigate between files in the playlist with j/k or Option+Left/Right.
j playlist-next
k playlist-prev
Alt+LEFT playlist-prev
Alt+RIGHT playlist-next

# Open the interactive playlist selector.
p script-binding select/select-playlist
