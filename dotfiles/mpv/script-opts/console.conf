# Keep mpv's shared selection menus compact and consistent with ModernX.
font_size=18
gap=0.15
padding=12
corner_radius=10
background_alpha=32
# Reserve vertical space so long lists do not fill the entire window.
margin_y=180

# Use the same neutral text and red accent as the playback controls.
focused_color=#FFFFFF
focused_back_color=#FF0000
match_color=#FF0000

# Prefer clean, flat text and menu surfaces over the stock outlined look.
border_size=0
menu_outline_size=0
