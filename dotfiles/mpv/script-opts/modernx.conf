# Keep the familiar full transport layout without ModernX's extra web features.
layout_option=original
compact_mode=no
key_bindings=no
download_button=no
show_description=no
info_button=no
ontop_button=no
screenshot_button=no
loop_button=no

# Behave like the stock OSC: mouse movement reveals it, then it fades away.
bottom_hover=no
hide_timeout=3000
fade_duration=180
show_on_pause=no
osc_on_seek=no

# Scale from a normalized canvas instead of raw pixels. This keeps controls
# physically usable across Retina, 4K, and standard-density displays.
vid_scale=yes
# Windowed playback needs larger targets because the video surface is smaller;
# fullscreen keeps the same proportions without becoming oversized.
scale_windowed=1.35
scale_fullscreen=1.0
scale_forced_window=1.0

# Preserve the complete stock transport set and timeline information.
show_title=yes
show_chapter_title=yes
show_chapter_markers=yes
jump_buttons=yes
chapter_skip_buttons=yes
track_nextprev_buttons=yes
volume_control=yes
seek_range=yes
seek_range_alpha=145
time_total=yes

# Tokyo Night-inspired dark surface and cool blue accent.
osc_color=#16161E
title_color=#C0CAF5
time_color=#A9B1D6
chapter_title_color=#A9B1D6
side_buttons_color=#C0CAF5
middle_buttons_color=#C0CAF5
playpause_color=#FFFFFF
seekbarfg_color=#7AA2F7
seekbarbg_color=#565F89
seekbar_cache_color=#7DCFFF
chapter_marker_color=#BB9AF7
chapter_marker_current_color=#7DCFFF
held_element_color=#565F89
hover_effect_color=#7DCFFF
thumbnail_border_color=#7AA2F7
thumbnail_border_outline=#16161E
volumebar_match_seek_color=yes

# Slim, rounded progress controls and restrained hover animation.
seekbar_height=3
seek_handle_size=0.7
chapter_marker_style=gap
hover_effect=size,color
hover_button_size=110
fade_alpha=88
fade_blur_strength=55
thumbnail_border_radius=8
